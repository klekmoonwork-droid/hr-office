name: เก็บสถานะบอท (snapshot)

on:
  schedule:
    - cron: '*/15 * * * *'   # ทุก 15 นาที (GitHub อาจดีเลย์ได้บ้าง)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'bots.json'
      - 'scripts/snapshot.mjs'
      - '.github/workflows/snapshot.yml'

permissions:
  contents: write

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: ตรวจว่าตั้ง secret BOTS_TOKEN แล้วหรือยัง
        id: check
        env:
          GH_TOKEN: ${{ secrets.BOTS_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::ยังไม่ได้ตั้ง secret BOTS_TOKEN — ข้ามการอัปเดต (ดูวิธีตั้งใน README)"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: ดึงสถานะจาก GitHub Actions ของทุก repo
        if: steps.check.outputs.ok == 'true'
        env:
          # ต้องเป็น PAT ที่อ่าน Actions ของ repo อื่นได้
          # (GITHUB_TOKEN ปกติเห็นแค่ repo ตัวเอง)
          GH_TOKEN: ${{ secrets.BOTS_TOKEN }}
        run: node scripts/snapshot.mjs

      - name: commit ถ้าข้อมูลเปลี่ยน
        if: steps.check.outputs.ok == 'true'
        run: |
          git config user.name  'hr-office-bot'
          git config user.email 'hr-office-bot@users.noreply.github.com'
          git add data/status.json
          if git diff --staged --quiet; then
            echo "ไม่มีอะไรเปลี่ยน"
          else
            git commit -m "snapshot: $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
